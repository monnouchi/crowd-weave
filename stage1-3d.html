<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>住宅街・斜め見下ろし3D試作 | ライブへ行こう！</title>
    <link rel="stylesheet" href="./stage1-3d.css" />
  </head>
  <body>
    <main>
      <canvas id="scene" role="img" aria-label="少し斜め上から見た住宅街。中央の道路を進み、立ち話の二人をよけて、先で待つ友だちに会うゲーム"></canvas>
      <svg id="speech-link" hidden aria-hidden="true"><path /></svg>
      <div id="speech-bubble" hidden role="status" aria-live="polite"></div>
      <header class="hud">
        <span class="eyebrow">STAGE 1 · 3D 試作</span>
        <h1>ライブへ行こう！</h1>
        <p>住宅街で友だちと合流</p>
        <div class="stats">
          <span>到着タイム <strong id="time">0.0秒</strong></span>
          <span>接触 <strong id="hits">0回</strong></span>
        </div>
      </header>
      <div class="toolbar">
        <button id="pause" type="button" aria-label="一時停止">一時停止</button>
        <button id="restart" type="button" aria-label="この区間をやり直す">やり直す</button>
      </div>
      <div class="touch-controls" aria-label="左右の移動操作">
        <button id="left" type="button" aria-label="左へ移動">← 左へ</button>
        <span>自動で前進<br />両押しで停止</span>
        <button id="right" type="button" aria-label="右へ移動">右へ →</button>
      </div>
      <div id="panel" class="panel" role="dialog" aria-labelledby="panel-title">
        <section>
          <span class="eyebrow">住宅街 · 固定カメラ試作</span>
          <h2 id="panel-title">友だちのところへ</h2>
          <p id="panel-message">左右のボタン、または ← → / A D でよけます。両押しで止まれます。人にぶつかると2秒加算されます。</p>
          <button id="action" type="button">はじめる</button>
          <p class="note">この試作はステージ1のみです。<a href="https://monnouchi.github.io/crowd-weave/">公開中の全5ステージ版</a></p>
        </section>
      </div>
    </main>
    <script type="module" src="./stage1-3d.js"></script>
  </body>
</html>
