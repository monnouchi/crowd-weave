<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="人混みをよけて、待ち合わせへ。全5ステージの駅の人流ゲーム。スマホとキーボードで遊べます。"
    />
    <link rel="canonical" href="https://monnouchi.github.io/crowd-weave/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="雑踏突破 / Crowd Weave" />
    <meta
      property="og:description"
      content="人の流れに、すきまを見つけよう。人混みをよけて待ち合わせへ向かう全5ステージのゲーム。"
    />
    <meta
      property="og:url"
      content="https://monnouchi.github.io/crowd-weave/"
    />
    <meta
      property="og:image"
      content="https://monnouchi.github.io/crowd-weave/og.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="雑踏突破のタイトルと、駅の人混みをよけて歩く実際のゲーム画面"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="雑踏突破 / Crowd Weave" />
    <meta
      name="twitter:description"
      content="人の流れに、すきまを見つけよう。全5ステージの駅の人流ゲーム。"
    />
    <meta
      name="twitter:image"
      content="https://monnouchi.github.io/crowd-weave/og.png"
    />
    <meta
      name="twitter:image:alt"
      content="雑踏突破のタイトルと駅のゲーム画面"
    />
    <link rel="icon" href="data:," />
    <title>雑踏突破 | Crowd Weave</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">STATION / 01</span>
          <h1>
            <b id="game-name">雑踏突破</b
            ><span id="scene-purpose">北口のカフェ前で待ち合わせ</span>
          </h1>
        </div>
        <span class="badge" id="stage">STAGE 1 / 5 · 朝の改札</span>
      </header>
      <section class="stats" aria-label="記録">
        <div>
          到着タイム<strong id="time">0.0<span>秒</span></strong>
        </div>
        <div>
          接触<strong id="hits">0<span>回</span></strong>
        </div>
        <div>
          目的地まで<strong id="distance">100<span>%</span></strong>
        </div>
      </section>
      <div class="stage">
        <canvas
          id="game"
          tabindex="0"
          aria-describedby="keyboard-help"
          width="480"
          height="680"
          aria-label="駅の人混みを避けて待ち合わせ相手まで歩くゲーム"
        ></canvas>
        <div
          id="overlay"
          class="overlay"
          role="dialog"
          aria-labelledby="title"
          aria-describedby="message enter-hint"
        >
          <div class="card">
            <span class="eyebrow" id="label">FIND YOUR WAY THROUGH</span>
            <h2 id="title">人の流れに、<br />すきまを見つけよう。</h2>
            <p id="message">
              駅を行き交う人をよけて、北口で待つ人のもとへ。<br />自動で前へ。左右ボタンでよけ、両方でブレーキ。
            </p>
            <button id="action" aria-describedby="enter-hint">
              突破をはじめる →
            </button>
            <div id="share-actions" hidden>
              <button id="share" class="secondary">結果画像を共有・保存</button
              ><button id="copy-result" class="secondary">文章コピー</button>
              <p id="share-status" role="status"></p>
            </div>
            <p id="enter-hint" class="enter-hint">Enter で開始</p>
          </div>
        </div>
        <div id="goal-callout" hidden>こっちだよ！</div>
        <div id="notice" role="status" aria-live="polite"></div>
      </div>
      <div class="steering">
        <button id="left" aria-label="左へ移動">← 左へ</button
        ><span id="motion">自動で前進 · 両押しで停止</span
        ><button id="right" aria-label="右へ移動">右へ →</button>
      </div>
      <footer>
        <p id="keyboard-help">
          PC：← → / A D · Enterで次へ · Escで停止
          <span>スマホ：左右のボタン · 両方を押すと停止</span>
        </p>
        <div>
          <button
            id="sound"
            class="secondary"
            aria-label="ミュート切り替え"
            aria-pressed="false"
          >
            音：ON</button
          ><button id="pause" class="secondary" disabled>一時停止</button
          ><button id="restart" class="secondary">やり直す</button>
        </div>
      </footer>
      <p class="license">
        <a href="./LICENSE">MIT License</a> · © 2026 monnouchi
      </p>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
