<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151c25" />
    <meta name="description" content="雑踏突破。人波のすきまを読み、一声で道をひらく。一人称視点で友だちとライブを目指す、全5区間のブラウザゲーム。" />
    <link rel="canonical" href="https://monnouchi.github.io/crowd-weave/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="雑踏突破 | 人波をぬけて、ライブへ" />
    <meta property="og:description" content="人波のすきまを読み、一声で道をひらく。一人称視点の全5区間ブラウザゲーム。" />
    <meta property="og:url" content="https://monnouchi.github.io/crowd-weave/" />
    <meta property="og:image" content="https://monnouchi.github.io/crowd-weave/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="雑踏突破。人波の間に見える待ち合わせ場所を、一人称視点のゲーム画面で描いた画像" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:," />
    <title>雑踏突破 | 人波をぬけて、ライブへ</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main id="app">
      <canvas id="world" tabindex="0" role="img" aria-label="目の高さから見た人混み。前へ進みながら人のすきまを探すゲーム画面"></canvas>
      <div id="flash" aria-hidden="true"></div>

      <header class="hud" aria-label="進行状況">
        <div class="hud-line">
          <span class="stage-number" id="stage-number">01 / 05</span>
          <strong id="stage-name">夕暮れの路地</strong>
          <span class="time" id="time">0:00</span>
          <button id="sound" class="icon-button" type="button" aria-label="音を消す" aria-pressed="true" title="音のオン・オフ">♪</button>
          <button id="pause" class="icon-button" type="button" aria-label="一時停止" title="一時停止">Ⅱ</button>
        </div>
        <div id="progress" class="progress" role="progressbar" aria-label="目的地までの進行度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
        <div class="hud-detail"><span id="flow" aria-live="off">人波を見よう</span><span id="hits">接触 0</span></div>
      </header>

      <div id="cue" class="cue" role="status" aria-live="polite"></div>
      <div id="road-warning" class="road-warning" role="status" aria-live="polite" hidden></div>
      <div id="hint" class="hint">左右でよける　両押しで待つ</div>

      <nav id="controls" class="controls" aria-label="移動と声かけ">
        <button id="left" class="steer" type="button" aria-label="左へ移動">←<small>左</small></button>
        <button id="call" class="call" type="button" aria-label="すみませーんと声をかける"><span>すみませーん</span><small id="call-label">声をかける</small></button>
        <button id="right" class="steer" type="button" aria-label="右へ移動">→<small>右</small></button>
      </nav>

      <section id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-body">
        <div class="overlay-card">
          <span id="overlay-kicker" class="kicker">雑踏突破 / 01</span>
          <div id="logo-wrap" class="logo-wrap"><img src="./logo.png" alt="" aria-hidden="true" /></div>
          <h1 id="overlay-title">雑踏突破</h1>
          <p id="overlay-body" class="overlay-lead">開演まで、あと少し。<br />友だちとライブの最前列へ。</p>
          <p id="overlay-extra" class="overlay-extra">人波のすきまを読み、一声かけて道をひらこう。</p>
          <div id="overlay-stats" class="overlay-stats" hidden><div><small>タイム</small><strong id="result-time">0:00</strong></div><div><small>接触</small><strong id="result-hits">0</strong></div></div>
          <div id="overlay-guide" class="overlay-guide"><div><b>← →</b><span>左右によける</span></div><div><b>同時</b><span>待つ</span></div><div><b>声</b><span>人が道をあける</span></div></div>
          <button id="action" class="action" type="button">歩き出す <span aria-hidden="true">↗</span></button>
          <button id="secondary" class="secondary-action" type="button" hidden>この区間をやり直す</button>
          <p id="overlay-foot" class="overlay-foot">PC は ← → / A D、C で声をかける。Esc で一時停止。</p>
        </div>
      </section>
      <p class="sr-only" id="screen-reader-update" aria-live="polite"></p>
    </main>
  </body>
</html>
